[package]
name = "raytracing-in-one-weekend-v2"
version = "0.2.0"
infc_version = "0.0.6"
description = "Ray Tracing in One Weekend (book v4) in Inference, Q20.20 fixed point"

[build]
wasm-features = ["bulk-memory"]

[build.wasm-opt]
enabled = true
level = "s"

# The nearest-hit scan's grid parameter is passed by reference, but the
# stack-budget analysis charges it a full 40 KB slot (see src/main.inf).
[memory]
pages = 2
stack-size = 131072
